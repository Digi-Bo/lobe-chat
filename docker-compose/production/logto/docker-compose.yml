version: '3.8'

services:
  lobechat:
    image: lobehub/lobe-chat-database
    container_name: lobe-chat
    ports:
      - '3210:3210'
    environment:
      # LobeChat URL
      - 'APP_URL=${APP_URL}'  # Domaine de LobeChat (ex. https://lobe.example.com)

      # PostgreSQL (Supabase)
      - 'DATABASE_URL=${DATABASE_URL}'  # URL de connexion PostgreSQL

      # Secret pour cryptage
      - 'KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}'

      # Authentification avec NextAuth et LogTo
      - 'NEXT_AUTH_SECRET=${NEXT_AUTH_SECRET}'  # Secret NextAuth
      - 'NEXT_AUTH_SSO_PROVIDERS=${NEXT_AUTH_SSO_PROVIDERS}'  # Fournisseur d'authentification
      - 'NEXTAUTH_URL=${NEXTAUTH_URL}'  # URL de callback NextAuth
      - 'AUTH_LOGTO_ID=${AUTH_LOGTO_ID}'  # ID de l'application LogTo
      - 'AUTH_LOGTO_SECRET=${AUTH_LOGTO_SECRET}'  # Secret de l'application LogTo
      - 'AUTH_LOGTO_ISSUER=${AUTH_LOGTO_ISSUER}'  # URL de l'API LogTo (OIDC)

      # MinIO (S3) configuration
      - 'S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}'
      - 'S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}'
      - 'S3_ENDPOINT=${S3_ENDPOINT}'  # Endpoint pour MinIO
      - 'S3_BUCKET=${S3_BUCKET}'  # Nom du bucket
      - 'S3_PUBLIC_DOMAIN=${S3_PUBLIC_DOMAIN}'  # Domaine public
      - 'S3_ENABLE_PATH_STYLE=${S3_ENABLE_PATH_STYLE}'  # Activer le style des chemins pour MinIO

      # OpenAI (si utilisé pour les modèles d'embedding)
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'  # Clé API OpenAI
      - 'OPENAI_PROXY_URL=${OPENAI_PROXY_URL}'  # URL du proxy OpenAI
      - 'OPENAI_MODEL_LIST=${OPENAI_MODEL_LIST}'  # Liste des modèles OpenAI (optionnel)

    restart: always

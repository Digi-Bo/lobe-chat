name: lobe-chat-database
services:
  lobe:
    image: lobehub/lobe-chat-database
    container_name: lobe-chat
    ports:
      - '3210:3210'
    environment:
      # Connexion à PostgreSQL dans Supabase
      - 'DATABASE_URL=${DATABASE_URL}'
      
      # API Supabase (Frontend/REST)
      - 'NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      
      # Connexion à MinIO
      - 'MINIO_ENDPOINT=${MINIO_ENDPOINT}'
      - 'MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}'
      - 'MINIO_SECRET_KEY=${MINIO_SECRET_KEY}'
      
      # Connexion à LogTo
      - 'AUTH_ENDPOINT=${AUTH_ENDPOINT}'  # URL de l'API LogTo
      - 'AUTH_CLIENT_ID=${AUTH_CLIENT_ID}'  # Client ID pour l'authentification OAuth
      - 'AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}'  # Secret client pour OAuth

      
      # Configuration JWT
      - 'JWT_EXPIRY=3600'  # Expiration des tokens
      
      # Autres configurations si nécessaires
      - 'DEBUG=true'  # Activer le mode débogage si besoin
    restart: always

volumes: {}
